# GitHub Actions port of azure-pipelines.yml.
#
# Pipeline shape (mirrors the Azure DevOps stages):
#   compute-version -> tests-linux + tests-windows -> coverage
#                                        \-> build-msix (x64, ARM64) -> release
#
# Notes:
# - PR validation is provided by the pull_request trigger below; no extra
#   branch policy is required.
# - A push to main creates a GitHub Release with the x64 and ARM64 MSIX files.
# - The Store submission packages (.msixupload) are retained as workflow
#   artifacts: download both of them from the successful run and submit them
#   to Partner Center. They are not public release downloads.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  buildConfiguration: Release
  packageMajor: 2
  packageMinor: 0
  # Microsoft Store reserves the fourth component for Store use. The third
  # component must stay monotonic across every submission. GitHub Actions has
  # no pipeline counter, so github.run_number (per workflow) is used with an
  # Offset 36 makes the next run (#4) version 2.0.40.0. If this workflow file
  # is ever deleted and recreated, bump packageBuildOffset so the first new
  # version stays above the last Store-submitted version.
  packageBuildOffset: 36
  # Pinned linux/amd64 manifest from Docker Hub (2026-08-10). Update explicitly
  # after reviewing upstream changes; never replace this with a floating tag.
  sftpTestImage: atmoz/sftp@sha256:81fa92512bf8ead4849f33c1c153907b86d32d77704d1c62a9c70b4316ae9e50
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  compute-version:
    name: Compute monotonic Store version
    runs-on: ubuntu-24.04
    outputs:
      store_version: ${{ steps.version.outputs.store_version }}
    steps:
      - id: version
        run: |
          set -euo pipefail
          major="$packageMajor"
          minor="$packageMinor"
          build=$(( packageBuildOffset + ${{ github.run_number }} ))
          revision=0
          for part in "$major" "$minor" "$build" "$revision"; do
            if ! [[ "$part" =~ ^[0-9]+$ ]] || (( part < 0 || part > 65535 )); then
              echo "Every Store package version component must be between 0 and 65535: $major.$minor.$build.$revision" >&2
              exit 1
            fi
          done
          if (( revision != 0 )); then
            echo "Store package revision must remain zero: $major.$minor.$build.$revision" >&2
            exit 1
          fi
          version="$major.$minor.$build.$revision"
          echo "store_version=$version" >> "$GITHUB_OUTPUT"
          echo "Store package version for run ${{ github.run_number }}: $version"

  tests-linux:
    name: Unit and disposable-SFTP tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SFTP_TEST_ENABLED: "1"
      SFTP_TEST_HOST: 127.0.0.1
      SFTP_TEST_PORT: "2222"
      SFTP_TEST_USERNAME: test
      SFTP_TEST_PASSWORD: password
      SFTP_TEST_WRITABLE_PATH: /upload
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Require the real test project
        shell: pwsh
        run: |
          $project = "${{ github.workspace }}/SftpExplorer.Tests/SftpExplorer.Tests.csproj"
          if (!(Test-Path -LiteralPath $project -PathType Leaf)) {
            throw "Required test project is missing: $project"
          }

      - name: Restore tests
        run: dotnet restore SftpExplorer.Tests/SftpExplorer.Tests.csproj

      - name: Start pinned disposable SFTP server
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/sftp-explorer-host-key"
          mkdir -p "$key_dir"
          ssh-keygen -q -t ed25519 -N '' -f "$key_dir/ssh_host_ed25519_key"
          chmod 600 "$key_dir/ssh_host_ed25519_key"

          docker run --detach \
            --name sftp-explorer-ci \
            --publish 127.0.0.1:2222:22 \
            --volume "$key_dir/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro" \
            --volume "$key_dir/ssh_host_ed25519_key.pub:/etc/ssh/ssh_host_ed25519_key.pub:ro" \
            "$sftpTestImage" \
            test:password:::upload

          fingerprint="$(docker exec sftp-explorer-ci ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub -E sha256 | awk '{print $2}')"
          fingerprint="${fingerprint#SHA256:}"
          if [ -z "$fingerprint" ]; then
            echo "Unable to calculate the disposable server's mounted host-key fingerprint" >&2
            exit 1
          fi
          echo "SFTP_TEST_HOST_KEY_SHA256=$fingerprint" >> "$GITHUB_ENV"

          for attempt in $(seq 1 30); do
            if nc -z 127.0.0.1 2222; then
              exit 0
            fi
            sleep 2
          done

          docker logs sftp-explorer-ci
          exit 1

      - name: Run unit and SFTP integration tests
        run: >-
          dotnet test SftpExplorer.Tests/SftpExplorer.Tests.csproj
          --no-restore
          --configuration "$buildConfiguration"
          --logger "trx;LogFileName=sftp-explorer-tests.trx"
          --collect "Code Coverage;Format=Cobertura"
          --settings SftpExplorer.Tests/coverage.runsettings
          --results-directory "$RUNNER_TEMP/TestResults"

      - name: Require non-empty test run and SFTP smoke test
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $resultsDirectory = Join-Path $env:RUNNER_TEMP 'TestResults'
          $results = @(Get-ChildItem -LiteralPath $resultsDirectory -Filter *.trx -File -ErrorAction SilentlyContinue)
          if ($results.Count -ne 1) {
            throw "Expected exactly one TRX result file, found $($results.Count)."
          }

          [xml]$trx = Get-Content -LiteralPath $results[0].FullName -Raw
          $counters = $trx.SelectSingleNode("//*[local-name()='Counters']")
          if ($null -eq $counters -or [int]$counters.total -lt 1 -or [int]$counters.executed -lt 1) {
            throw "The test run did not execute any tests."
          }

          $integrationName = 'SftpExplorerWinUI.Tests.SftpIntegrationTests.DisposableServerSupportsBasicFileAndDirectoryLifecycle'
          $integration = $trx.SelectSingleNode("//*[local-name()='UnitTestResult' and @testName='$integrationName']")
          if ($null -eq $integration -or $integration.outcome -ne 'Passed') {
            throw "The disposable-SFTP integration test did not pass."
          }

          Write-Host "Verified $($counters.executed) executed test(s), including disposable SFTP."

      - name: Stage Linux coverage report
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'TestResults') -Recurse -Filter *.cobertura.xml -File)
          if ($reports.Count -lt 1) {
            throw "The Linux test run did not produce a Cobertura report."
          }
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'CoverageLinux'
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          Copy-Item -LiteralPath $reports[0].FullName -Destination (Join-Path $artifactDirectory "coverage.cobertura.xml") -Force

      - name: Upload Linux test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results-linux
          path: |
            ${{ runner.temp }}/TestResults
            ${{ runner.temp }}/CoverageLinux

      - name: Stop disposable SFTP server
        if: always()
        run: docker rm --force sftp-explorer-ci || true

  tests-windows:
    name: Windows persistence and security tests
    runs-on: windows-latest # windows-2025 image with Visual Studio 2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore Windows tests
        run: dotnet restore SftpExplorer.Tests/SftpExplorer.Tests.csproj

      - name: Run Windows persistence and security tests
        shell: pwsh
        run: >-
          dotnet test SftpExplorer.Tests/SftpExplorer.Tests.csproj
          --no-restore
          --configuration $env:buildConfiguration
          --logger "trx;LogFileName=sftp-explorer-windows-tests.trx"
          --collect "Code Coverage;Format=Cobertura"
          --settings SftpExplorer.Tests/coverage.runsettings
          --results-directory "$env:RUNNER_TEMP\WindowsTestResults"

      - name: Require Windows DPAPI coverage
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $results = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'WindowsTestResults') -Filter *.trx -File -ErrorAction SilentlyContinue)
          if ($results.Count -ne 1) {
            throw "Expected exactly one Windows TRX result file, found $($results.Count)."
          }

          [xml]$trx = Get-Content -LiteralPath $results[0].FullName -Raw
          $counters = $trx.SelectSingleNode("//*[local-name()='Counters']")
          if ($null -eq $counters -or [int]$counters.executed -lt 1) {
            throw "The Windows test run did not execute any tests."
          }

          $legacyPasswordTest = 'SftpExplorerWinUI.Tests.ConnectionManagerTests.LegacyPasswordRemainsUsableWhenCredentialMigrationFails'
          $result = $trx.SelectSingleNode("//*[local-name()='UnitTestResult' and @testName='$legacyPasswordTest']")
          if ($null -eq $result -or $result.outcome -ne 'Passed') {
            throw "The Windows DPAPI migration fallback test did not pass."
          }

      - name: Stage Windows coverage report
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'WindowsTestResults') -Recurse -Filter *.cobertura.xml -File)
          if ($reports.Count -lt 1) {
            throw "The Windows test run did not produce a Cobertura report."
          }
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'CoverageWindows'
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          Copy-Item -LiteralPath $reports[0].FullName -Destination (Join-Path $artifactDirectory "coverage.cobertura.xml") -Force

      - name: Upload Windows test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results-windows
          path: |
            ${{ runner.temp }}/WindowsTestResults
            ${{ runner.temp }}/CoverageWindows

  coverage:
    name: Publish combined code coverage
    needs: [tests-linux, tests-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: test-results-linux
          path: coverage/linux

      - uses: actions/download-artifact@v7
        with:
          name: test-results-windows
          path: coverage/windows

      - name: Require both coverage reports
        shell: pwsh
        run: |
          # Each test artifact contains its original TestResults directory as
          # well as this staged copy. Select the staged copies explicitly so
          # the duplicate reports do not invalidate a successful test run.
          $reports = @(
            "${{ github.workspace }}/coverage/linux/CoverageLinux/coverage.cobertura.xml"
            "${{ github.workspace }}/coverage/windows/CoverageWindows/coverage.cobertura.xml"
          )
          $missingReports = @($reports | Where-Object { !(Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missingReports.Count -gt 0) {
            throw "Missing staged coverage report(s): $($missingReports -join ', ')"
          }
          Write-Host "Publishing the staged Linux and Windows coverage reports."

      # Optional: push to Codecov instead of (or in addition to) the artifact.
      # - uses: codecov/codecov-action@v4
      #   with:
      #     files: coverage/linux/CoverageLinux/coverage.cobertura.xml,coverage/windows/CoverageWindows/coverage.cobertura.xml

      - name: Upload combined coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: code-coverage
          path: coverage

  build-msix:
    name: Build MSIX Store upload (${{ matrix.platform }})
    needs: [compute-version, tests-linux, tests-windows]
    runs-on: windows-latest # windows-2025 image with Visual Studio 2026 and Windows SDK 10.0.26xxx
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    env:
      BuildPlatform: ${{ matrix.platform }}
      StorePackageVersion: ${{ needs.compute-version.outputs.store_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set monotonic Store package version
        shell: pwsh
        run: |
          $version = "$env:StorePackageVersion"
          $parsedVersion = [Version]$version
          if ($parsedVersion.Revision -ne 0) {
            throw "Store package revision must remain zero: $version"
          }
          if (@($parsedVersion.Major, $parsedVersion.Minor, $parsedVersion.Build, $parsedVersion.Revision) |
              Where-Object { $_ -lt 0 -or $_ -gt 65535 }) {
            throw "Every Store package version component must be between 0 and 65535: $version"
          }

          [xml]$manifest = Get-Content -LiteralPath "${{ github.workspace }}/Package.appxmanifest"
          $manifest.Package.Identity.Version = $version
          $manifest.Save("${{ github.workspace }}/Package.appxmanifest")
          Write-Host "Packaging version $version for $env:BuildPlatform"

      - name: Build Store package
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "Visual Studio locator is missing: $vswhere"
          }

          $msbuild = @(& $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\Current\Bin\amd64\MSBuild.exe') | Select-Object -First 1
          if (!$msbuild -or !(Test-Path -LiteralPath $msbuild -PathType Leaf)) {
            throw 'The required 64-bit Visual Studio MSBuild executable was not found.'
          }

          $packageDir = Join-Path $env:RUNNER_TEMP "StorePackages/$env:BuildPlatform/"
          $runtimeIdentifier = "win-$($env:BuildPlatform.ToLowerInvariant())"
          & $msbuild SftpExplorerWinUI.csproj `
            /m `
            /nr:false `
            /restore `
            /t:Publish `
            "-p:Configuration=$($env:buildConfiguration)" `
            "-p:Platform=$env:BuildPlatform" `
            "-p:RuntimeIdentifier=$runtimeIdentifier" `
            -p:GenerateAppxPackageOnBuild=true `
            "-p:AppxPackageDir=$packageDir" `
            -p:UapAppxPackageBuildMode=StoreUpload `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxAutoIncrementPackageRevision=false `
            -p:AppxBundle=Never `
            -p:AppxSymbolPackageEnabled=true `
            -p:DebugSymbols=true `
            "-p:Version=$env:StorePackageVersion" `
            "-p:AssemblyVersion=$env:StorePackageVersion" `
            "-p:FileVersion=$env:StorePackageVersion"
          if ($LASTEXITCODE -ne 0) {
            throw "Visual Studio MSBuild failed with exit code $LASTEXITCODE."
          }

      - name: Validate upload, symbols, version, architecture, and payload
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          function Get-PeMachine([string]$Path) {
            $stream = [IO.File]::OpenRead($Path)
            $reader = [IO.BinaryReader]::new($stream)
            try {
              if ($reader.ReadUInt16() -ne 0x5A4D) {
                throw "'$Path' does not have an MZ header."
              }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              if ($peOffset -lt 0x40 -or $peOffset -gt ($stream.Length - 6)) {
                throw "'$Path' has an invalid PE offset."
              }
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                throw "'$Path' does not have a PE signature."
              }
              return $reader.ReadUInt16()
            }
            finally {
              $reader.Dispose()
              $stream.Dispose()
            }
          }

          $version = "$env:StorePackageVersion"
          $platform = "$env:BuildPlatform"
          $packageRoot = Join-Path $env:RUNNER_TEMP "StorePackages/$platform"
          $uploads = @(Get-ChildItem -LiteralPath $packageRoot -Recurse -Filter *.msixupload -File)
          if ($uploads.Count -ne 1) {
            throw "Expected exactly one .msixupload in $packageRoot, found $($uploads.Count)."
          }

          $agentTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
          $validationRoot = Join-Path $agentTemp "validate-msix-$platform-$([Guid]::NewGuid().ToString('N'))"
          if (!$validationRoot.StartsWith($agentTemp, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Unsafe validation directory: $validationRoot"
          }
          New-Item -ItemType Directory -Path $validationRoot | Out-Null

          try {
            $uploadArchive = [IO.Compression.ZipFile]::OpenRead($uploads[0].FullName)
            try {
              $msixEntries = @($uploadArchive.Entries | Where-Object FullName -Match '\.msix$')
              $symbolEntries = @($uploadArchive.Entries | Where-Object FullName -Match '\.appxsym$')
              if ($msixEntries.Count -ne 1) {
                throw "Store upload must contain exactly one .msix; found $($msixEntries.Count)."
              }
              if ($symbolEntries.Count -ne 1) {
                throw "Store upload must contain exactly one .appxsym; found $($symbolEntries.Count)."
              }

              $msixPath = Join-Path $validationRoot 'package.msix'
              $symbolPath = Join-Path $validationRoot 'package.appxsym'
              [IO.Compression.ZipFileExtensions]::ExtractToFile($msixEntries[0], $msixPath, $true)
              [IO.Compression.ZipFileExtensions]::ExtractToFile($symbolEntries[0], $symbolPath, $true)
            }
            finally {
              $uploadArchive.Dispose()
            }

            $msixArchive = [IO.Compression.ZipFile]::OpenRead($msixPath)
            try {
              $entryNames = @($msixArchive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
              $requiredEntries = @(
                'AppxManifest.xml',
                'SftpExplorer.exe',
                'SftpExplorer.dll',
                'Microsoft.Terminal.Control.dll',
                'Microsoft.Terminal.WinUI3.dll',
                'Microsoft.Terminal.WinUI3/TerminalControl.xbf'
              )
              foreach ($requiredEntry in $requiredEntries) {
                if ($entryNames -notcontains $requiredEntry) {
                  throw "MSIX is missing required entry '$requiredEntry'."
                }
              }

              $manifestEntry = $msixArchive.Entries | Where-Object FullName -EQ 'AppxManifest.xml' | Select-Object -First 1
              $reader = [IO.StreamReader]::new($manifestEntry.Open())
              try { [xml]$packageManifest = $reader.ReadToEnd() }
              finally { $reader.Dispose() }

              $actualVersion = [string]$packageManifest.Package.Identity.Version
              $actualArchitecture = ([string]$packageManifest.Package.Identity.ProcessorArchitecture).ToLowerInvariant()
              $expectedArchitecture = "$platform".ToLowerInvariant()
              if ($actualVersion -ne "$version") {
                throw "MSIX version '$actualVersion' does not match expected '$version'."
              }
              if (([Version]$actualVersion).Revision -ne 0) {
                throw "MSIX revision must be zero: $actualVersion"
              }
              if ($actualArchitecture -ne $expectedArchitecture) {
                throw "MSIX architecture '$actualArchitecture' does not match '$expectedArchitecture'."
              }

              foreach ($payloadName in @('SftpExplorer.exe', 'SftpExplorer.dll', 'Microsoft.Terminal.Control.dll')) {
                $payloadEntry = $msixArchive.Entries | Where-Object FullName -EQ $payloadName | Select-Object -First 1
                [IO.Compression.ZipFileExtensions]::ExtractToFile(
                  $payloadEntry,
                  (Join-Path $validationRoot $payloadName),
                  $true)
              }
            }
            finally {
              $msixArchive.Dispose()
            }

            $expectedVersion = [Version]"$version"
            foreach ($versionedPayload in @('SftpExplorer.exe', 'SftpExplorer.dll')) {
              $payloadPath = Join-Path $validationRoot $versionedPayload
              $versionInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo($payloadPath)
              if ([Version]$versionInfo.FileVersion -ne $expectedVersion) {
                throw "$versionedPayload file version '$($versionInfo.FileVersion)' does not match '$expectedVersion'."
              }
              $numericProductVersion = [Version]::new(
                $versionInfo.ProductMajorPart,
                $versionInfo.ProductMinorPart,
                $versionInfo.ProductBuildPart,
                $versionInfo.ProductPrivatePart)
              if ($numericProductVersion -ne $expectedVersion) {
                throw "$versionedPayload product version '$($versionInfo.ProductVersion)' does not match '$expectedVersion'."
              }
            }

            $assemblyVersion = [Reflection.AssemblyName]::GetAssemblyName(
              (Join-Path $validationRoot 'SftpExplorer.dll')).Version
            if ($assemblyVersion -ne $expectedVersion) {
              throw "SftpExplorer.dll assembly version '$assemblyVersion' does not match '$expectedVersion'."
            }

            $expectedMachine = if ($expectedArchitecture -eq 'x64') { 0x8664 } else { 0xAA64 }
            foreach ($nativePayload in @('SftpExplorer.exe', 'Microsoft.Terminal.Control.dll')) {
              $actualMachine = Get-PeMachine (Join-Path $validationRoot $nativePayload)
              if ($actualMachine -ne $expectedMachine) {
                throw ("{0} PE machine 0x{1:X4} does not match {2} (0x{3:X4})." -f `
                  $nativePayload, $actualMachine, $expectedArchitecture, $expectedMachine)
              }
            }

            $symbolArchive = [IO.Compression.ZipFile]::OpenRead($symbolPath)
            try {
              $pdbs = @($symbolArchive.Entries | Where-Object FullName -Match '(^|[/\\])SftpExplorer\.pdb$')
              if ($pdbs.Count -lt 1) {
                throw "The .appxsym package does not contain SftpExplorer.pdb."
              }
            }
            finally {
              $symbolArchive.Dispose()
            }

            # Store upload files are available only as workflow artifacts.
            # GitHub Releases receive the per-architecture MSIX files.
            $storeArtifactRoot = Join-Path $env:RUNNER_TEMP 'StoreUploadStaging'
            $releaseRoot = Join-Path $env:RUNNER_TEMP 'ReleaseStaging'
            New-Item -ItemType Directory -Path $storeArtifactRoot -Force | Out-Null
            New-Item -ItemType Directory -Path $releaseRoot -Force | Out-Null
            Copy-Item -LiteralPath $uploads[0].FullName -Destination (Join-Path $storeArtifactRoot "SftpExplorer_${version}_${platform}.msixupload") -Force
            Copy-Item -LiteralPath $msixPath -Destination (Join-Path $releaseRoot "SftpExplorer_${version}_${platform}.msix") -Force

            Write-Host "Validated Store upload: $($uploads[0].FullName)"
          }
          finally {
            if (Test-Path -LiteralPath $validationRoot) {
              Remove-Item -LiteralPath $validationRoot -Recurse -Force
            }
          }

      - name: Upload Microsoft Store submission package
        uses: actions/upload-artifact@v6
        with:
          name: store-upload-${{ matrix.platform }}
          path: ${{ runner.temp }}/StoreUploadStaging/*.msixupload
          if-no-files-found: error

      - name: Upload MSIX release artifact
        uses: actions/upload-artifact@v6
        with:
          name: msix-${{ matrix.platform }}
          path: ${{ runner.temp }}/ReleaseStaging
          if-no-files-found: error

  release:
    name: Publish MSIX to GitHub Release
    needs: [compute-version, build-msix]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: msix-x64
          path: packages/x64

      - uses: actions/download-artifact@v7
        with:
          name: msix-ARM64
          path: packages/ARM64

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.compute-version.outputs.store_version }}
          fail_on_unmatched_files: true
          files: |
            packages/**/*.msix
          body: |
            SFTP Explorer ${{ needs.compute-version.outputs.store_version }} (CI build from `main`).

            - `*.msix` — unsigned Store build output for x64 and ARM64.
            - The corresponding `*.msixupload` files (with `.appxsym` symbols) are available as private workflow artifacts for Microsoft Store submission.
